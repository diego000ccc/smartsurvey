<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSurvey — Live Results</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f4ff; --surface: #ffffff; --surface-alt: #eef2ff;
    --border: #d0d9f5; --border-strong: #a0b0e8;
    --blue: #1a6bff; --blue-dark: #0047d6; --blue-light: #e6eeff; --blue-mid: #4d8fff;
    --ink: #0d1530; --ink-muted: #5a6690; --ink-faint: #9aa3c2;
    --radius: 10px;
  }
  body { font-family: Helvetica,'Helvetica Neue',Arial,sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 1.1rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  .logo { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.03em; }
  .logo span { color: var(--blue); }
  .header-tag { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); background: var(--blue-light); border: 1px solid var(--border); padding: 4px 12px; border-radius: 99px; }

  main { flex: 1; display: flex; justify-content: center; padding: 2.5rem 1.5rem; }

  .container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 1.5rem; }

  /* Top stats bar */
  .stats-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.4rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 24px rgba(26,107,255,0.07);
  }
  .stats-left { display: flex; flex-direction: column; gap: 3px; }
  .stats-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
  .stats-sub { font-size: 13px; color: var(--ink-muted); }
  .stats-right { display: flex; gap: 2rem; }
  .stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--blue); letter-spacing: -0.03em; }
  .stat-label { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .refresh-btn {
    font-family: Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size: 12px; font-weight: 600; padding: 7px 14px;
    border-radius: var(--radius); cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface-alt);
    color: var(--ink-muted); transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { background: var(--blue-light); border-color: var(--blue-mid); color: var(--blue); }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Question cards */
  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem 2rem;
    box-shadow: 0 4px 24px rgba(26,107,255,0.05);
  }

  .result-category { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue); margin-bottom: 5px; }
  .result-question { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.2rem; line-height: 1.35; color: var(--ink); letter-spacing: -0.01em; }

  .bar-row { display: flex; flex-direction: column; gap: 10px; }

  .bar-item { display: flex; flex-direction: column; gap: 4px; }
  .bar-top { display: flex; justify-content: space-between; align-items: baseline; }
  .bar-label { font-size: 13px; color: var(--ink); }
  .bar-label.winner { font-weight: 700; color: var(--blue-dark); }
  .bar-meta { font-size: 11px; color: var(--ink-faint); }
  .bar-track { height: 10px; background: var(--surface-alt); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; background: var(--blue-mid); border-radius: 99px; width: 0%; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .bar-fill.winner { background: linear-gradient(90deg, var(--blue-dark), var(--blue)); }

  /* Loading */
  #screen-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 4rem; text-align: center; width: 100%; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading-text { font-size: 14px; color: var(--ink-muted); }

  /* Empty */
  #screen-empty { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 4rem; text-align: center; width: 100%; }
  .empty-icon { width: 52px; height: 52px; background: var(--blue-light); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .empty-title { font-size: 1.1rem; font-weight: 700; }
  .empty-sub { font-size: 13px; color: var(--ink-muted); }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #0f9d58; display: inline-block; margin-right: 5px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .last-updated { font-size: 11px; color: var(--ink-faint); text-align: center; padding-bottom: 1rem; }

  footer { text-align: center; padding: 1.2rem; font-size: 11.5px; color: var(--ink-faint); border-top: 1px solid var(--border); margin-top: auto; }
</style>
</head>
<body>

<header>
  <div class="logo">Smart<span>Survey</span></div>
  <div class="header-tag"><span class="live-dot"></span>Live Results</div>
</header>

<main>
  <div class="container">

    <div id="screen-loading">
      <div class="spinner"></div>
      <p class="loading-text">Loading results…</p>
    </div>

    <div id="screen-empty">
      <div class="empty-icon">
        <svg width="24" height="24" fill="none" stroke="#1a6bff" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      </div>
      <div class="empty-title">No responses yet</div>
      <p class="empty-sub">Share the survey link to start collecting answers!</p>
    </div>

    <div id="results-wrap" style="display:none; flex-direction:column; gap:1.5rem;"></div>

  </div>
</main>

<footer>SmartSurvey · School project · Results update in real time</footer>

<script>
const DB_URL = 'https://smartsurvey-e3ec1-default-rtdb.firebaseio.com';

const questions = [
  { category: "📚 Study Habits", text: "Which study method do you rely on the most?", options: ["Notes and textbooks", "Online videos", "AI tools (e.g. ChatGPT)", "A mix of all"] },
  { category: "📚 Study Habits", text: "How often do you use AI tools for schoolwork?", options: ["Very often", "Sometimes", "Rarely", "Never"] },
  { category: "📚 Study Habits", text: "When do you usually start studying for a test?", options: ["Several days before", "1-2 days before", "The day before", "Last minute"] },
  { category: "📚 Study Habits", text: "What affects your focus the most?", options: ["Phone and social media", "Noise and environment", "Lack of motivation", "Tiredness"] },
  { category: "⏰ Daily Habits", text: "How many hours do you spend on your phone daily?", options: ["Less than 2 hours", "2-4 hours", "4-6 hours", "More than 6 hours"] },
  { category: "⏰ Daily Habits", text: "How many hours do you sleep on average?", options: ["Less than 5 hours", "5-6 hours", "6-8 hours", "More than 8 hours"] },
  { category: "⏰ Daily Habits", text: "How long does it take you to get to school?", options: ["Less than 10 minutes", "10-20 minutes", "20-40 minutes", "More than 40 minutes"] },
  { category: "⏰ Daily Habits", text: "How do you usually get to school?", options: ["Walking", "By bike", "Public transport", "By car"] },
  { category: "🎯 Mindset", text: "Do you feel stressed about school?", options: ["Always", "Often", "Sometimes", "Rarely"] },
  { category: "🎯 Mindset", text: "What motivates you the most to study?", options: ["Good grades", "Future career", "Family expectations", "Personal interest"] }
];

async function fetchData() {
  const res = await fetch(DB_URL + '/survey.json');
  if (!res.ok) throw new Error('Failed to fetch');
  const data = await res.json();
  if (data && data.questions && !Array.isArray(data.questions)) {
    data.questions = Object.values(data.questions);
  }
  return data;
}

function renderResults(data) {
  const wrap = document.getElementById('results-wrap');
  const total = data.totalRespondents || 0;

  if (total === 0) {
    document.getElementById('screen-empty').style.display = 'flex';
    document.getElementById('screen-empty').style.flexDirection = 'column';
    wrap.style.display = 'none';
    return;
  }

  document.getElementById('screen-empty').style.display = 'none';

  // Stats bar
  const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  let html = `
    <div class="stats-bar">
      <div class="stats-left">
        <div class="stats-title">Survey Results</div>
        <div class="stats-sub"><span class="live-dot"></span>Live · Last updated ${now}</div>
      </div>
      <div class="stats-right">
        <div class="stat-item">
          <span class="stat-num">${total}</span>
          <span class="stat-label">Respondents</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">${questions.length}</span>
          <span class="stat-label">Questions</span>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadResults(this)" title="Refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0020.49 15"/>
        </svg>
        Refresh
      </button>
    </div>
  `;

  // Question cards
  questions.forEach((q, qi) => {
    const votesMap = (data.questions[qi] && data.questions[qi].votes) ? data.questions[qi].votes : {};
    const totalVotes = Object.values(votesMap).reduce((a, b) => a + b, 0);
    const maxVotes = Math.max(...q.options.map((_, i) => votesMap['opt' + i] || 0));

    const bars = q.options.map((opt, oi) => {
      const c = votesMap['opt' + oi] || 0;
      const pct = totalVotes > 0 ? Math.round((c / totalVotes) * 100) : 0;
      const isWinner = c === maxVotes && c > 0;
      return `
        <div class="bar-item">
          <div class="bar-top">
            <span class="bar-label${isWinner ? ' winner' : ''}">${isWinner ? '🏆 ' : ''}${opt}</span>
            <span class="bar-meta">${pct}% &nbsp;·&nbsp; ${c} vote${c !== 1 ? 's' : ''}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill${isWinner ? ' winner' : ''}" data-target="${pct}" style="width:0%"></div>
          </div>
        </div>`;
    }).join('');

    html += `
      <div class="result-card">
        <div class="result-category">${q.category}</div>
        <div class="result-question">${q.text}</div>
        <div class="bar-row">${bars}</div>
      </div>`;
  });

  wrap.innerHTML = html;
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';

  // Animate bars
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill[data-target]').forEach((bar, i) => {
      setTimeout(() => { bar.style.width = bar.getAttribute('data-target') + '%'; }, 60 + i * 40);
    });
  }));
}

async function loadResults(btn) {
  if (btn) {
    btn.classList.add('spinning');
    btn.disabled = true;
  }
  try {
    const data = await fetchData();
    renderResults(data);
  } catch (e) {
    console.error(e);
  }
  if (btn) {
    setTimeout(() => { btn.classList.remove('spinning'); btn.disabled = false; }, 600);
  }
}

// Initial load
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const data = await fetchData();
    document.getElementById('screen-loading').style.display = 'none';
    renderResults(data);
  } catch (e) {
    document.getElementById('screen-loading').innerHTML = '<p style="color:#d93025;font-size:14px;">Could not load results. Check your connection.</p>';
  }
});

// Auto-refresh every 30 seconds
setInterval(() => loadResults(null), 30000);
</script>
</body>
</html>
